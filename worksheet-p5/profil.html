<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Lembar A: Meta Viewport Mandatory -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Hero Favorit Mobile Legends: Bang Bang</title>
  
  <!-- CSS Modular -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/komponen.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/responsif.css">
</head>
<body>
  <div class="page">
    <!-- Kepala Halaman / Navbar -->
    <header class="kepala">
      <h1>Koleksi Hero Favorit Mobile Legends: Bang Bang</h1>
      <nav class="navigasi">
        <a href="#galeri" class="tombol">Daftar Hero</a>
        <a href="#tambah" class="tombol">Tambah Hero Baru</a>
      </nav>
    </header>

    <!-- Konten Utama & Sidebar (Grid Layout) -->
    <div class="isi content">
      <!-- Sidebar / Sisi Samping -->
      <aside class="sisi sidebar">
        <h2>Hero yang Sering Dimainkan</h2>
        <div class="galeri-mini">
  <div class="kartu-mini">
    <img src="hero-favorit-1.jpg" alt="Fanny">
    <div class="info-hero">
      <strong>Fanny</strong>
      <span>Assassin</span>
    </div>
  </div>
  <div class="kartu-mini">
    <img src="hero-favorit-2.jpg" alt="Ling">
    <div class="info-hero">
      <strong>Ling</strong>
      <span>Assassin</span>
    </div>
  </div>
  <div class="kartu-mini">
    <img src="hero-favorit-3.jpg" alt="Chou">
    <div class="info-hero">
      <strong>Chou</strong>
      <span>Fighter</span>
    </div>
  </div>
</div>

        <h3>Daftar Performa Hero Favorit</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nama Hero</th>
                <th>Role / Peran</th>
                <th>Win Rate (%)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Fanny</td>
                <td>Assassin</td>
                <td>65.0%</td>
              </tr>
              <tr>
                <td>Ling</td>
                <td>Assassin</td>
                <td>58.0%</td>
              </tr>
              <tr>
                <td>Chou</td>
                <td>Fighter</td>
                <td>60.0%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </aside>

      <!-- Area Utama / Form & Galeri -->
      <main class="utama main-content">
        <section id="tambah" class="kartu">
          <h2>Tambah Hero Baru</h2>
          <form class="formulir">
            <div class="grup-input">
              <label for="nama">Nama Hero:</label>
              <input type="text" id="nama" placeholder="Contoh: Hayabusa">
            </div>
            <div class="grup-input">
              <label for="role">Role Hero:</label>
              <input type="text" id="role" placeholder="Contoh: Assassin">
            </div>
            <div class="grup-input">
              <label for="wr">Win Rate (%):</label>
              <input type="text" id="wr" placeholder="Contoh: 55.5">
            </div>
            <button type="submit" class="tombol-utama">Simpan Hero</button>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
